
name: Update publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate publications data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIB_REPO_OWNER: ncas-metoffice-hrcm
          BIB_REPO_NAME: publications
          BIB_REPO_BRANCH: main
          PUBLICATIONS_OUTPUT: _data/publications.json
        run: python scripts/build_publications.py

      - name: Commit generated data
        run: |
          if git diff --quiet -- _data/publications.json; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json
          git commit -m "Update publications from BibTeX source"
          git push
