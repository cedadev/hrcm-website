name: Update simulations

on:
  # Manual only: run from the Actions tab with "Run workflow"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-simulations
  cancel-in-progress: false

env:
  SOURCE_REPO: ncas-metoffice-hrcm/simulations
  SOURCE_REF: main
  # Directories in the source repo to read, in the order they appear in the table.
  # Add a new directory name here if you ever create one (e.g. "UM LFRic JULES").
  SOURCE_DIRS: "UM LFRic"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repo
        uses: actions/checkout@v4

      - name: Check out source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          # Only needed if the source repo is private. Create a fine-grained token with
          # read-only "Contents" access to the source repo and save it as SIMULATIONS_REPO_TOKEN.
          token: ${{ secrets.SIMULATIONS_REPO_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build _data/simulations.yml
        run: |
          python scripts/build_simulations.py \
            --source source \
            --dirs ${SOURCE_DIRS} \
            --out _data/simulations.yml \
            --columns _data/simulation_columns.yml \
            --source-sha "$(git -C source rev-parse HEAD)" \
            --source-repo "${SOURCE_REPO}"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/simulations.yml
          if git diff --cached --quiet; then
            echo "No changes to simulations.yml"
          else
            git commit -m "Update simulations data from ${SOURCE_REPO}"
            git push
          fi
